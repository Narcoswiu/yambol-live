<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ЯМБОЛ 2026 — Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Табло за състезание: тъмен пит-уол екран, злато за лидерите */
:root{
  --bg:#0b1016; --panel:#121a24; --panel2:#0e1620; --line:#1f2d3d;
  --fg:#edf2f7; --muted:#8fa0b3; --gold:#f5c518; --navy:#142037;
  --g1:#f5c518; --g2:#c9d3dd; --g3:#e0a36a; --bad:#ff6b5e; --live:#22c55e;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.45 Roboto,system-ui,Segoe UI,Arial,sans-serif;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:900px;margin:0 auto}
header{padding:22px 0 0;text-align:center}
h1{font-family:Oswald,Roboto,sans-serif;font-weight:700;font-size:clamp(34px,8vw,54px);letter-spacing:.04em;margin:0;line-height:1.05;text-wrap:balance}
h1 small{display:block;font-size:.32em;letter-spacing:.42em;color:var(--gold);font-weight:600;margin-top:6px}
.stripe{height:6px;background:linear-gradient(90deg,transparent,var(--gold) 15%,var(--gold) 85%,transparent);border-radius:3px;margin:14px auto 0;max-width:420px}
.status{display:flex;justify-content:center;align-items:center;gap:8px;margin:14px 0 4px;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.status b{color:var(--live);font-weight:700;letter-spacing:.08em}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:16px 0 18px}
.tabs button{font:600 14px Oswald,sans-serif;letter-spacing:.06em;color:var(--muted);background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;min-height:40px}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:#1a1405}
.err{display:none;background:#3a1512;border:1px solid #7f2a22;color:#ffb4ab;border-radius:10px;padding:12px 14px;margin:0 0 14px;font-size:14px}
.err.show{display:block}
.board{display:grid;gap:18px}
section.cls{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
section.cls h2{font-family:Oswald,sans-serif;font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  margin:0;padding:11px 16px;background:var(--navy);color:#cfe0f5;display:flex;justify-content:space-between;align-items:baseline}
section.cls h2 span{font-size:12px;color:var(--muted);letter-spacing:.03em;text-transform:none}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th{font:600 11px Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.pos{width:54px;text-align:center}
td.num{width:56px;font-family:Oswald,sans-serif;font-size:17px;color:var(--gold);text-align:center}
td.team{font-weight:700;font-size:16px}
td.names{color:var(--muted);font-size:13.5px;min-width:180px}
td.time{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:16px;white-space:nowrap;width:110px}
td.pen{text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;width:92px}
tr.p1 td.pen{color:var(--g1)}
.pos i{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;
  font:700 14px Oswald,sans-serif;font-style:normal;background:#223146;color:var(--fg)}
tr.p1 .pos i{background:var(--g1);color:#211a03}
tr.p2 .pos i{background:var(--g2);color:#1c2430}
tr.p3 .pos i{background:var(--g3);color:#2d1c0a}
tr.p1 td.team,tr.p1 td.time{color:var(--g1)}
tr.off td{color:var(--muted)}
tr.off td.team{color:var(--muted);font-weight:500}
tr.off .pos i{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--bad);margin-left:6px}
.empty{padding:26px 16px;color:var(--muted);text-align:center}
footer{margin:22px 0 6px;text-align:center;color:var(--muted);font-size:12px;letter-spacing:.04em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ЯМБОЛ 2026<small>ОТБОРНО • КЛАСИРАНЕ</small></h1>
    <div class="stripe"></div>
    <div class="status"><span class="dot"></span><b>НА ЖИВО</b><span id="upd">зареждане…</span></div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Класове"></nav>
  <div class="err" id="err">Няма връзка с таблицата. Проверете интернета — или в Google Sheets: Сподели → „Всеки с връзката“ → Зрител.</div>
  <main class="board" id="board"><div class="empty">Зареждане на класирането…</div></main>

  <footer>Обновява се автоматично на всеки 15 секунди</footer>
</div>

<script>
'use strict';
var SHEET_ID = '1s-pP6nke0cq5siZG0sik6iDBv6wYMckCIcc34VxsrJc';
var URL_ = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
  '/gviz/tq?tqx=out:json&sheet=' + encodeURIComponent('Отборно') + '&range=I5:V154';

var state = { rows: [], classes: [], tab: 'Всички', ok: false };
var $ = function (s) { return document.querySelector(s); };

function fmtDur(v) { // v = доля от деня (Google time serial)
  if (typeof v !== 'number' || !isFinite(v)) return '';
  var t = Math.round(v * 86400), h = Math.floor(t / 3600),
      m = Math.floor(t % 3600 / 60), s = t % 60, p = function (n) { return (n < 10 ? '0' : '') + n; };
  return h + ':' + p(m) + ':' + p(s);
}
function cell(row, i) { var c = row.c && row.c[i]; return c ? c : null; }
function timeFrac(v) { // число ИЛИ "Date(1899,11,30,ч,м,с)" от gviz
  if (typeof v === 'number' && isFinite(v)) return v;
  if (typeof v === 'string') {
    var m = v.match(/^Date\(\d+,\d+,(\d+),(\d+),(\d+),(\d+)/);
    if (m) return ((+m[1] - 30) * 86400 + (+m[2]) * 3600 + (+m[3]) * 60 + (+m[4])) / 86400;
  }
  return null;
}
function txt(row, i) { var c = cell(row, i); return c && c.v != null ? String(c.v) : ''; }

function parse(body) {
  var a = body.indexOf('('), b = body.lastIndexOf(')');
  if (a < 0 || b < 0) throw new Error('bad');
  var j = JSON.parse(body.slice(a + 1, b));
  if (!j.table || !j.table.rows) throw new Error('bad');
  // диапазон I..V → индекси: 0=Отбор 5=Време(N) 6=флаг(O) 9=етикет(R) 10=№(S) 11=Клас(T) 12=Имена(U) 13=Наказания мин(V)
  var out = [];
  j.table.rows.forEach(function (r) {
    var team = txt(r, 0); if (!team) return;
    var tc = cell(r, 5), flag = txt(r, 6);
    var timeVal = tc ? timeFrac(tc.v) : null;
    var timeStr = tc ? (tc.f || (timeVal != null ? fmtDur(timeVal) : '')) : '';
    var pc = cell(r, 13);
    var pen = pc && typeof pc.v === 'number' ? Math.round(pc.v) + ' мин' : '';
    out.push({ team: team, num: txt(r, 10), cls: txt(r, 11) || '—', names: txt(r, 12), pen: pen,
               label: txt(r, 9), time: timeStr, tv: timeVal, off: flag === '1' || timeVal == null });
  });
  return out;
}

function render() {
  var rows = state.rows, board = $('#board');
  var classes = []; rows.forEach(function (r) { if (classes.indexOf(r.cls) < 0) classes.push(r.cls); });
  classes.sort(); state.classes = classes;

  var tabs = ['Всички'].concat(classes);
  $('#tabs').innerHTML = tabs.map(function (t) {
    return '<button type="button" class="' + (t === state.tab ? 'on' : '') + '" data-t="' + t.replace(/"/g, '&quot;') + '">' + t + '</button>';
  }).join('');

  var show = state.tab === 'Всички' ? classes : classes.filter(function (c) { return c === state.tab; });
  if (!rows.length) { board.innerHTML = '<div class="empty">Още няма отбори.</div>'; return; }

  board.innerHTML = show.map(function (cls) {
    var list = rows.filter(function (r) { return r.cls === cls; });
    list.sort(function (a, b) {
      if (a.off !== b.off) return a.off ? 1 : -1;
      if (a.tv == null || b.tv == null) return a.team.localeCompare(b.team, 'bg');
      return a.tv - b.tv;
    });
    var pos = 0;
    var body = list.map(function (r) {
      var cls2 = '', posHtml;
      if (!r.off) { pos++; posHtml = '<i>' + pos + '</i>'; if (pos <= 3) cls2 = 'p' + pos; }
      else { posHtml = '<i>—</i>'; cls2 = 'off'; }
      var tag = /DNF|DSQ/.test(r.label) ? '<span class="tag">' + (r.label.match(/DNF|DSQ/)[0]) + '</span>' : '';
      var esc = function (s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
      return '<tr class="' + cls2 + '"><td class="pos">' + posHtml + '</td><td class="num">' + esc(r.num) + '</td>' +
        '<td class="team">' + esc(r.team) + tag + '</td><td class="names">' + esc(r.names) + '</td>' +
        '<td class="pen">' + (r.pen || '—') + '</td>' +
        '<td class="time">' + (r.time || '—') + '</td></tr>';
    }).join('');
    var done = list.filter(function (r) { return !r.off; }).length;
    return '<section class="cls"><h2>' + cls + '<span>' + done + ' / ' + list.length + ' финиширали</span></h2>' +
      '<div class="tw"><table><thead><tr><th>Място</th><th>№</th><th>Отбор</th><th>Състезатели</th><th style="text-align:center">Наказания</th><th style="text-align:right">Време</th></tr></thead>' +
      '<tbody>' + (body || '<tr><td colspan="6" class="empty">Няма отбори в този клас</td></tr>') + '</tbody></table></div></section>';
  }).join('');
}

function tick() {
  fetch(URL_ + '&_=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (body) {
      state.rows = parse(body); state.ok = true;
      $('#err').classList.remove('show');
      var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
      $('#upd').textContent = 'обновено в ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
      render();
    })
    .catch(function () {
      $('#err').classList.add('show');
      if (!state.ok) $('#board').innerHTML = '<div class="empty">Чакам връзка с таблицата…</div>';
    });
}

document.getElementById('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  state.tab = b.getAttribute('data-t'); render();
});

tick();
setInterval(tick, 15000);
</script>
</body>
</html>
